name: Bootstrap Denner assets

on:
  push:
    paths:
      - ".github/workflows/bootstrap-assets.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original captured assets
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            url="$1"
            out="$2"
            mkdir -p "$(dirname "$out")"
            curl -fL --retry 3 --connect-timeout 20 "$url" -o "$out"
          }
          fetch "https://jd-cms.onrender.com/uploads/small_3_e83234be47.png" "__external__/jd-cms.onrender.com/uploads/small_3_e83234be47.png"
          fetch "https://jd-cms.onrender.com/uploads/small_1_73a6ec1049.png" "__external__/jd-cms.onrender.com/uploads/small_1_73a6ec1049.png"
          fetch "https://jd-cms.onrender.com/uploads/small_2_20c22f0c1e.png" "__external__/jd-cms.onrender.com/uploads/small_2_20c22f0c1e.png"
          fetch "https://jd-cms.onrender.com/uploads/small_4_b8ffb083f1.png" "__external__/jd-cms.onrender.com/uploads/small_4_b8ffb083f1.png"
          fetch "https://jd-cms.onrender.com/uploads/large_4_b8ffb083f1.png" "__external__/jd-cms.onrender.com/uploads/large_4_b8ffb083f1.png"
          fetch "https://jd-cms.onrender.com/uploads/large_3_e83234be47.png" "__external__/jd-cms.onrender.com/uploads/large_3_e83234be47.png"
          fetch "https://jasminadenner.com/assets/images/image01-2.png" "assets/images/image01-2.png"
          fetch "https://jd-cms.onrender.com/uploads/small_5_361930f3e4.png" "__external__/jd-cms.onrender.com/uploads/small_5_361930f3e4.png"
          fetch "https://jd-cms.onrender.com/uploads/large_2_20c22f0c1e.png" "__external__/jd-cms.onrender.com/uploads/large_2_20c22f0c1e.png"
          fetch "https://jd-cms.onrender.com/uploads/medium_image05_490dadf5bf.jpg" "__external__/jd-cms.onrender.com/uploads/medium_image05_490dadf5bf.jpg"
          fetch "https://jd-cms.onrender.com/uploads/small_image05_490dadf5bf.jpg" "__external__/jd-cms.onrender.com/uploads/small_image05_490dadf5bf.jpg"
          fetch "https://jasminadenner.com/assets/images/image01.png" "assets/images/image01.png"
          fetch "https://jd-cms.onrender.com/uploads/large_Book_hp_white_f7afd84012.png" "__external__/jd-cms.onrender.com/uploads/large_Book_hp_white_f7afd84012.png"
          fetch "https://jd-cms.onrender.com/uploads/medium_3_e83234be47.png" "__external__/jd-cms.onrender.com/uploads/medium_3_e83234be47.png"
          fetch "https://jd-cms.onrender.com/uploads/small_Book_hp_white_f7afd84012.png" "__external__/jd-cms.onrender.com/uploads/small_Book_hp_white_f7afd84012.png"
          fetch "https://jd-cms.onrender.com/uploads/medium_4_b8ffb083f1.png" "__external__/jd-cms.onrender.com/uploads/medium_4_b8ffb083f1.png"
          fetch "https://jd-cms.onrender.com/uploads/medium_2_20c22f0c1e.png" "__external__/jd-cms.onrender.com/uploads/medium_2_20c22f0c1e.png"
          fetch "https://jd-cms.onrender.com/uploads/large_1_73a6ec1049.png" "__external__/jd-cms.onrender.com/uploads/large_1_73a6ec1049.png"
