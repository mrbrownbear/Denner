name: Bootstrap Denner site

on:
  push:
    paths:
      - ".github/workflows/bootstrap-assets.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror the original site
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit
          import re
          import time

          ROOT = Path(".")
          ORIGIN = "https://jasminadenner.com"
          CMS = "https://jd-cms.onrender.com"
          routes = [
              "",
              "longevity-intelligence/",
              "book/",
              "lab/",
              "about/",
              "ventures/",
              "the-intelligence-report/",
              "the-longevity-library/",
              "contact/",
              "ip-usage-policy/",
          ]

          def get(url):
              req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              last = None
              for _ in range(3):
                  try:
                      with urlopen(req, timeout=45) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(2)
              raise last

          def save(url, rel):
              p = ROOT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(get(url))
              print(url, "->", rel)

          for route in routes:
              rel = "index.html" if not route else route + "index.html"
              save(ORIGIN + "/" + route, rel)

          seed = [
              "/manifest.json",
              "/assets/css/main.297c4bd9b5d865065d9d.css",
              "/assets/js/main.a583e79ccc364c90284f.js",
          ]
          for path in seed:
              try:
                  save(ORIGIN + path, path.lstrip("/"))
              except Exception as e:
                  print("optional seed failed", path, e)

          absolute_re = re.compile(r'https://(?:jasminadenner\.com/(?:assets|icons)/|jd-cms\.onrender\.com/uploads/)[^"\'<> )]+')
          root_re = re.compile(r'(?:"|\')(/(?:assets|icons)/[^"\'<> )]+|/manifest\.json)(?:"|\')')

          def local_for(url):
              u = urlsplit(url)
              if u.netloc == "jasminadenner.com":
                  return u.path.lstrip("/")
              if u.netloc == "jd-cms.onrender.com":
                  return "__external__/jd-cms.onrender.com" + u.path
              return None

          seen = set()
          for _round in range(5):
              found = set()
              for p in ROOT.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".html", ".css", ".js", ".json"}:
                      continue
                  try:
                      text = p.read_text("utf-8")
                  except Exception:
                      continue
                  found.update(absolute_re.findall(text))
                  for path in root_re.findall(text):
                      found.add(ORIGIN + path)

              pending = [u for u in sorted(found) if u not in seen]
              if not pending:
                  break
              for url in pending:
                  seen.add(url)
                  rel = local_for(url)
                  if not rel:
                      continue
                  target = ROOT / rel
                  if target.exists():
                      continue
                  try:
                      save(url, rel)
                  except Exception as e:
                      print("asset failed", url, e)

          replacements = {
              "https://jasminadenner.com/assets/": "/assets/",
              "https://jasminadenner.com/icons/": "/icons/",
              "https://jasminadenner.com/manifest.json": "/manifest.json",
              "https://jd-cms.onrender.com/uploads/": "/__external__/jd-cms.onrender.com/uploads/",
          }
          for p in ROOT.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".html", ".css", ".js", ".json"}:
                  continue
              try:
                  text = p.read_text("utf-8")
              except Exception:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, "utf-8")

          # The contact form has no local backend in a static mirror.
          # Submit to the original endpoint so its behavior remains functional.
          for p in ROOT.rglob("*.html"):
              text = p.read_text("utf-8")
              text = text.replace(
                  '<form data-component="form" method="post" name="Footer Contact Form">',
                  '<form data-component="form" method="post" action="https://jasminadenner.com/" name="Footer Contact Form">'
              )
              p.write_text(text, "utf-8")
          PY

      - name: Commit mirrored site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Mirror Jasmina Denner site"
          git push
