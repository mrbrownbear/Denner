          fetch "https://jd-cms.onrender.com/uploads/medium_5_361930f3e4.png" "__external__/jd-cms.onrender.com/uploads/medium_5_361930f3e4.png"
          fetch "https://jasminadenner.com/manifest.json" "manifest.json"
          fetch "https://jasminadenner.com/assets/css/main.297c4bd9b5d865065d9d.css" "assets/css/main.297c4bd9b5d865065d9d.css"
          fetch "https://jasminadenner.com/assets/images/book.png" "assets/images/book.png"
          fetch "https://jasminadenner.com/icons/favicon-196.png" "icons/favicon-196.png"
