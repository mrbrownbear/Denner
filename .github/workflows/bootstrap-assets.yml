          fetch "https://jasminadenner.com/assets/fonts/0eff6bba3376806ce6e3.woff2" "assets/fonts/0eff6bba3376806ce6e3.woff2"
          fetch "https://jasminadenner.com/assets/js/main.a583e79ccc364c90284f.js" "assets/js/main.a583e79ccc364c90284f.js"
          fetch "https://jasminadenner.com/assets/fonts/db95a98e2b04a0c5f787.woff2" "assets/fonts/db95a98e2b04a0c5f787.woff2"
          fetch "https://jd-cms.onrender.com/uploads/large_5_361930f3e4.png" "__external__/jd-cms.onrender.com/uploads/large_5_361930f3e4.png"
          fetch "https://jasminadenner.com/assets/fonts/fd710497da6f571fc11f.woff2" "assets/fonts/fd710497da6f571fc11f.woff2"
          fetch "https://jasminadenner.com/assets/fonts/64a0dc6afe9fc2c2aa75.woff2" "assets/fonts/64a0dc6afe9fc2c2aa75.woff2"
          fetch "https://jasminadenner.com/icons/manifest-icon-192.maskable.png" "icons/manifest-icon-192.maskable.png"
          fetch "https://jasminadenner.com/assets/fonts/77e4591e6c6bb90817d5.woff2" "assets/fonts/77e4591e6c6bb90817d5.woff2"
          fetch "https://jasminadenner.com/assets/fonts/960e890cb970d849a8fc.woff2" "assets/fonts/960e890cb970d849a8fc.woff2"
          fetch "https://jasminadenner.com/assets/fonts/e76c1e332ec883024699.woff2" "assets/fonts/e76c1e332ec883024699.woff2"
          fetch "https://jd-cms.onrender.com/uploads/social_83c2d26f6a.jpg" "__external__/jd-cms.onrender.com/uploads/social_83c2d26f6a.jpg"
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets __external__ icons manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Denner site assets"
          git push
